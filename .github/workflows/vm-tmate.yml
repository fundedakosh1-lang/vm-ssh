name: vm-tmate

on:
  workflow_dispatch:
    inputs:
      duration_min:
        description: "Minutes before auto-kill"
        required: false
        default: "90"

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install my SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP1kucUA5yZcGi8ipuXgyokpivgHc62T/pdmd4jr/oal modal-sandbox" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys

      - name: Start tmate and publish access details
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TMATE_DURATION_MIN: ${{ github.event.inputs.duration_min }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmate jq >/dev/null
          # plain tmate prints "ssh ..." and "web ..." to stdout; keep it in tmux
          setsid tmux new-session -d -s tmate 'tmate > /tmp/tmate.log 2>&1' >/dev/null 2>&1 < /dev/null &
          sleep 5
          WEB="$(grep -oE 'https://[^ ]+' /tmp/tmate.log | head -1)"
          SSH_CMD="$(grep -oE 'ssh [^ ]+@[^ ]+' /tmp/tmate.log | head -1)"
          echo "WEB=$WEB"; echo "SSH_CMD=$SSH_CMD"; echo "--- log ---"; cat /tmp/tmate.log
          BODY=$(printf 'VM is up.\n\nWeb: %s\n\nSSH: `%s`\n\nAlive ~%s min.' "${WEB:-see logs}" "${SSH_CMD:-see logs}" "$TMATE_DURATION_MIN")
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fundedakosh1-lang/vm-ssh/issues/1/comments \
            -d "$(jq -n --arg b "$BODY" '{body:$b}')" >/dev/null
          echo "published"

      - name: Keep VM alive
        env:
          DURATION_MIN: ${{ github.event.inputs.duration_min }}
        run: |
          deadline=$(( $(date +%s) + ${DURATION_MIN} * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do sleep 30; done

name: vm-ssh

on:
  workflow_dispatch:
    inputs:
      duration_min:
        description: "Minutes before auto-kill"
        required: false
        default: "60"
      idle:
        description: "Idle grace (seconds) before kill"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install my SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP1kucUA5yZcGi8ipuXgyokpivgHc62T/pdmd4jr/oal modal-sandbox" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys

      - name: Install and start dropbear SSH on 2222
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dropbear
          sudo mkdir -p /run/sshd
          sudo dropbear -p 2222 -F -E &
          sleep 2
          pgrep -a dropbear || { echo "dropbear failed"; exit 1; }
          echo "SSH_READY"

      - name: Open Cloudflare TCP tunnel
        id: cf
        run: |
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb || sudo apt-get install -f -y -qq
          nohup cloudflared tunnel --url tcp://localhost:2222 --no-autoupdate >/tmp/cf.log 2>&1 &
          sleep 10
          HOST="$(grep -oE '[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)"
          PORT="$(grep -oE 'tcp://[a-z0-9.-]+:[0-9]+' /tmp/cf.log | grep -oE '[0-9]+$' | head -1)"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "port=${PORT:-443}" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARED_HOST=${HOST:-none}"
          echo "CLOUDFLARED_PORT=${PORT:-443}"
          if [ -z "$HOST" ]; then
            echo "--- cloudflared log ---"; tail -25 /tmp/cf.log
            exit 1
          fi
          echo "TUNNEL_READY ${HOST}:${PORT:-443}"

      - name: Keep VM alive
        env:
          DURATION_MIN: ${{ github.event.inputs.duration_min }}
          IDLE: ${{ github.event.inputs.idle }}
        run: |
          deadline=$(( $(date +%s) + ${DURATION_MIN} * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do sleep 30; done

name: ubuntu-vm

on:
  workflow_dispatch:
    inputs:
      duration_min:
        description: "Minutes before auto-kill"
        required: false
        default: "90"

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install my SSH public key
        run: |
          mkdir -p ~/.ssh
          echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP1kucUA5yZcGi8ipuXgyokpivgHc62T/pdmd4jr/oal modal-sandbox" >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys

      - name: Start dropbear SSH and expose it via localhost.run
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DURATION_MIN: ${{ github.event.inputs.duration_min }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dropbear jq >/dev/null
          sudo mkdir -p /run/sshd
          sudo dropbear -p 2222 -F -E >/tmp/dropbear.log 2>&1 &
          sleep 2
          pgrep -a dropbear || { echo "dropbear failed"; cat /tmp/dropbear.log; exit 1; }

          setsid ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes \
            -R 80:localhost:2222 nokey@localhost.run > /tmp/lhrun.log 2>&1 < /dev/null &
          sleep 10

          ADDR="$(grep -oE 'ssh -p [0-9]+ root@[a-z0-9.-]+\.localhost\.run' /tmp/lhrun.log | head -1)"
          echo "ADDR=$ADDR"
          BODY=$(printf 'Ubuntu VM is up.\n\nSSH: `%s`\n\nAlive ~%s min.' "${ADDR:-see logs}" "$DURATION_MIN")
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fundedakosh1-lang/vm-ssh/issues/1/comments \
            -d "$(jq -n --arg b "$BODY" '{body:$b}')" >/dev/null
          echo "published"

      - name: Keep VM alive
        env:
          DURATION_MIN: ${{ github.event.inputs.duration_min }}
        run: |
          deadline=$(( $(date +%s) + ${DURATION_MIN} * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do sleep 30; done
